<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="Catálogo Sublicuentas: streaming, IPTV, música, juegos y software. Consulte planes y precios actualizados.">
  <title>Sublicuentas — Catálogo Digital</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171717;color:#fff;font-family:Arial,sans-serif}
    iframe{position:fixed;inset:0;display:block;width:100%;height:100vh;height:100dvh;border:0;background:#171717}
    .loading{position:fixed;inset:0;display:grid;place-content:center;gap:16px;text-align:center;padding:24px;background:#171717;pointer-events:none}
    .loading p{margin:0;color:#bbb;line-height:1.5}.loading strong{color:#e2231a;font-size:24px}
    .fallback{position:fixed;left:12px;right:12px;top:12px;padding:16px;background:#222;border:1px solid #555;border-radius:8px;z-index:1;line-height:1.5}
    .fallback p{margin:0 0 12px}.fallback a{display:inline-block;padding:12px 16px;background:#e2231a;color:#fff;border-radius:6px;text-decoration:none}.fallback a:focus-visible{outline:2px solid #fff;outline-offset:3px}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <iframe id="catalogo" src="https://past-video-191624.framer.app/" title="Catálogo Sublicuentas: servicios, planes, cartelera y deportes" allow="fullscreen" allowfullscreen></iframe>
  <div id="loading" class="loading" role="status"><strong>Sublicuentas</strong><p>Abriendo su catálogo…</p></div>
  <div id="fallback" class="fallback" hidden><p>Si el catálogo tarda en aparecer, puede abrirlo directamente.</p><a href="https://past-video-191624.framer.app/">Abrir catálogo</a></div>
  <noscript><style>.loading{display:none}</style></noscript>
  <script>
    (()=>{
      const frame=document.getElementById('catalogo');
      const loading=document.getElementById('loading');
      const fallback=document.getElementById('fallback');
      const timer=setTimeout(()=>{loading.hidden=true;fallback.hidden=false},20000);
      frame.addEventListener('load',()=>{clearTimeout(timer);loading.hidden=true;fallback.hidden=true});
    })();
  </script>
</body>
</html>
